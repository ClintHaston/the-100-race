<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="$100 Race">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>The $100 Race</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%235B35E8'/><text x='50' y='66' font-size='48' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>$</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F2F3F7;--card:#FFFFFF;--ink:#16181D;--ink2:#4A505C;--ink3:#7A8190;--hair:#E4E6EC;--soft:#F6F7FA;
  --violet:#5B35E8;--violet-2:#EEE9FF;--up:#0B8A52;--up-bg:#E3F6EC;--down:#C8352E;--down-bg:#FCE8E6;--amber:#B26A00;--amber-bg:#FFF3DC;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--body:Figtree,"Segoe UI",system-ui,sans-serif;
  --r:22px;--shadow:0 1px 0 rgba(22,24,29,.04),0 8px 24px -12px rgba(22,24,29,.14);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:500 16px/1.5 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}
a{color:var(--violet)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.shell{max-width:1180px;margin:0 auto;padding:22px 24px 120px}
header.top{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.mark{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--display);letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.mark i{width:30px;height:30px;border-radius:50%;background:var(--violet);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
nav.tabs{display:flex;gap:4px;margin-left:24px;background:#E6E8EE;padding:4px;border-radius:14px}
nav.tabs button{border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:600;color:var(--ink2);cursor:pointer}
nav.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fresh{margin-left:auto;font-size:14px;color:var(--ink3);display:flex;align-items:center;gap:8px;white-space:nowrap}
.fresh b{width:8px;height:8px;border-radius:50%;background:var(--up);display:inline-block}
.fresh.warn b{background:var(--amber)}.fresh.warn{color:var(--amber)}
.page{display:none}.page.on{display:block}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:grid;gap:20px;min-width:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;min-width:0}
h2{font:700 21px/1.2 var(--display);letter-spacing:-.015em;margin:0 0 4px}
.sub{color:var(--ink3);font-size:14.5px;margin:0}
/* hero */
.hero .when{color:var(--ink3);font-size:15px;margin:0 0 6px}
.hero h1{font:700 clamp(34px,5vw,54px)/1.02 var(--display);letter-spacing:-.035em;margin:0;max-width:16ch}
.hero h1 .n{font-weight:800;color:var(--violet);white-space:nowrap}
.hero .say{margin:12px 0 0;font-size:17px;color:var(--ink2);max-width:52ch}
.chart{margin:18px -8px 0;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--ink3);font:500 12px var(--body)}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:6px 9px;border-radius:9px;transform:translate(-50%,-120%);white-space:nowrap;opacity:0;transition:opacity .12s}
.key{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin-top:6px}
.key span{display:flex;align-items:center;gap:7px}.key i{width:16px;height:3px;border-radius:2px;display:inline-block}
.money{display:grid;grid-template-columns:repeat(4,1fr);margin:20px -24px -24px;border-top:1px solid var(--hair)}
.money div{padding:14px 20px 18px;border-left:1px solid var(--hair)}.money div:first-child{border-left:0}
.money small{display:block;color:var(--ink3);font-size:13.5px}
.money b{font:700 23px/1.2 var(--display);letter-spacing:-.02em}
.pos{color:var(--up)}.neg{color:var(--down)}
/* to do */
.todo.calm{background:linear-gradient(160deg,#fff 0%,#F7F4FF 100%)}
.slip{border:1.5px solid var(--hair);border-radius:18px;padding:16px;margin-top:14px;background:#fff}
.slip.open{border-color:#CFC2FF;box-shadow:0 0 0 4px var(--violet-2)}
.slip h3{font:700 22px/1.15 var(--display);margin:0;letter-spacing:-.02em}
.slip p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.acts{display:flex;gap:10px;margin-top:14px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--ink)}
.btn.go{background:var(--violet);color:#fff;flex:1}
.btn.go:hover{background:#4A26D6}.btn:hover{filter:brightness(.97)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.kr{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;background:var(--ink);color:#fff;text-decoration:none}
.btn.kr:hover{background:#000}.btn.kr svg{flex:none}
.acts.after{margin-top:10px}
.krc{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;background:var(--soft);border:1px solid var(--hair);padding:4px 10px;border-radius:99px;white-space:nowrap}
.krc:hover{background:#EBEDF2}
.sheet .btn.kr{margin:14px 0 4px}
select{width:100%;padding:12px 14px;border:1.5px solid var(--hair);border-radius:12px;background:#fff;font:inherit}
.row.tap{cursor:pointer}.row.tap:hover .nm{color:var(--violet)}
.tot2{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}.tot2 b{font:700 30px/1.1 var(--display);letter-spacing:-.02em}
.linkbtn{border:0;background:none;color:var(--violet);font-weight:700;cursor:pointer;padding:0}
@media (max-width:900px){#other{order:4}}
.install{display:none;margin-top:14px}.install.on{display:block}
.steps{margin:10px 0 0;padding-left:20px;color:var(--ink2)}.steps li{margin:4px 0}
.calmtext{font-size:17px;color:var(--ink2);margin:10px 0 0;max-width:40ch}
/* holdings */
.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--hair)}
.row:first-of-type{border-top:0}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font:800 14px var(--display);letter-spacing:-.01em}
.row .nm{font-weight:700;font-size:16.5px}.row .dt{color:var(--ink3);font-size:14px}
.row .val{text-align:right;font:700 18px/1.2 var(--display)}.row .chg{text-align:right;font-size:14px;font-weight:600}
.empty{color:var(--ink3);padding:14px 0 4px;font-size:15.5px}
/* lanes compare */
.lane{display:grid;grid-template-columns:118px 1fr 76px;gap:12px;align-items:center;padding:7px 0;font-size:14.5px}
.lane .ln{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane.me .ln{color:var(--ink);font-weight:700}
.track{position:relative;height:12px;background:var(--soft);border-radius:6px}
.track .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:#C9CDD6;border-radius:1px}
.track .bar{position:absolute;top:0;bottom:0;border-radius:6px}
.lane .v{text-align:right;font-weight:700}
.you{display:inline-block;margin-left:6px;background:var(--violet);color:#fff;font-size:11.5px;padding:1px 7px;border-radius:99px;vertical-align:1px}
/* headlines */
.news{display:grid;gap:2px}
.nw{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--hair);text-decoration:none;color:inherit}
.nw:first-child{border-top:0}
.nw i{width:8px;height:8px;border-radius:50%;margin-top:8px;background:#C9CDD6}
.nw i.good{background:var(--up)}.nw i.bad{background:var(--down)}
.nw .t{font-weight:600;font-size:15px;line-height:1.35}.nw .m{color:var(--ink3);font-size:13px;margin-top:2px}
/* activity */
.act{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--hair)}
.act:first-child{border-top:0}
.tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.tag.done{background:var(--up-bg);color:var(--up)}.tag.open{background:var(--violet-2);color:var(--violet)}
.tag.skipped,.tag.expired{background:var(--soft);color:var(--ink3)}
.day{font:700 15px var(--display);color:var(--ink3);margin:18px 0 2px}
/* lanes page */
.lp{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;padding:16px 0;border-top:1px solid var(--hair)}
.lp:first-child{border-top:0}
.lp .how{color:var(--ink2);font-size:14.5px;margin-top:2px;max-width:60ch}
.lp .hold{color:var(--ink3);font-size:13.5px;margin-top:4px}
/* settings */
.links{display:grid;gap:10px;margin-top:12px}
.lk{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--soft);text-decoration:none;color:var(--ink);font-weight:600}
.lk span{margin-left:auto;color:var(--violet)}
.lk small{display:block;color:var(--ink3);font-weight:500}
details{margin-top:14px}summary{cursor:pointer;color:var(--ink2);font-weight:600}
label{display:block;font-size:14px;color:var(--ink2);margin:12px 0 5px}
input[type=url],input[type=number],input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--hair);border-radius:12px;background:#fff}
input:focus{border-color:var(--violet);outline:none}
.health{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px}
.hl{display:flex;gap:9px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px}
.hl i{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}.hl.bad i{background:var(--down)}
.hl small{color:var(--ink3);margin-left:auto;white-space:nowrap}
.facts{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;margin-top:12px;font-size:15px}
.facts dt{color:var(--ink3)}.facts dd{margin:0}
/* sheet (price prompt) */
.scrim{position:fixed;inset:0;background:rgba(22,24,29,.42);display:none;align-items:flex-end;justify-content:center;z-index:30}
.scrim.on{display:flex}
.sheet{background:#fff;width:min(460px,100%);border-radius:26px 26px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(24px);opacity:0;transition:transform .22s ease,opacity .22s ease}
.scrim.on .sheet{transform:none;opacity:1}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px}}
.sheet h3{font:700 26px/1.1 var(--display);letter-spacing:-.02em;margin:0}
.sheet p{color:var(--ink2);margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pre{position:relative}.pre span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);font-weight:600}.pre input{padding-left:30px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.err{background:var(--amber-bg);color:#6B4200;border-radius:16px;padding:14px 16px;margin-bottom:18px}
.foot{color:var(--ink3);font-size:13px;margin-top:26px;text-align:center}
@media (max-width:900px){.grid{display:flex;flex-direction:column}.col{display:contents}#todo{order:1}#todo.calm{order:3}#hero{order:2}#own{order:4}#compare{order:5}#nextin{order:6}#heads{order:7}}
@media (max-width:700px){
  .shell{padding:14px 14px 110px}
  nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin:0;justify-content:space-around;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);box-shadow:0 10px 30px -10px rgba(0,0,0,.3);border-radius:20px;z-index:20;padding:6px}
  nav.tabs button{flex:1;padding:10px 4px;font-size:14px}
  .card{padding:20px;border-radius:20px}
  .money{grid-template-columns:repeat(2,1fr);margin:18px -20px -20px}
  .money div:nth-child(3){border-left:0}.money div:nth-child(n+3){border-top:1px solid var(--hair)}
  .lane{grid-template-columns:96px 1fr 66px}
  .facts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="mark" href="#home"><i>$</i>the $100 race</a>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="fresh" id="fresh"><b></b><span>Loading</span></div>
  </header>
  <div id="error"></div>

  <section class="page on" id="p-home">
    <div class="grid">
      <div class="col">
        <div class="card hero" id="hero"></div>
        <div class="card" id="own"></div>
        <div class="card" id="other"></div>
        <div class="card" id="nextin"></div>
      </div>
      <div class="col">
        <div class="card todo" id="todo"></div>
        <div class="card" id="compare"></div>
        <div class="card" id="heads"></div>
      </div>
    </div>
  </section>

  <section class="page" id="p-activity">
    <div class="grid"><div class="col"><div class="card" id="activity"></div></div>
    <div class="col"><div class="card" id="actside"></div></div></div>
  </section>

  <section class="page" id="p-lanes">
    <div class="grid"><div class="col"><div class="card" id="lanesfull"></div></div>
    <div class="col"><div class="card" id="lanechart"></div></div></div>
  </section>

  <section class="page" id="p-settings">
    <div class="grid"><div class="col"><div class="card" id="mytrades"></div><div class="card" id="sys"></div></div>
    <div class="col"><div class="card" id="rules"></div></div></div>
  </section>
  <p class="foot">Signals come from fixed rules, not personal advice. You decide and place every trade yourself.</p>
</div>

<div class="scrim" id="scrim" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <h3 id="sh-t"></h3><p id="sh-p"></p><a class="btn kr" id="sh-kr" href="#">Open Kraken</a>
  <div class="two">
    <div><label for="sh-price" id="sh-pl">Price you paid</label><div class="pre"><span>$</span><input id="sh-price" type="number" inputmode="decimal" step="any" min="0"></div></div>
    <div><label for="sh-dol" id="sh-dl">Dollars</label><div class="pre"><span>$</span><input id="sh-dol" type="number" inputmode="decimal" step="any" min="0"></div></div>
  </div>
  <div class="acts"><button class="btn" id="sh-cancel">Not yet</button><button class="btn go" id="sh-save">Save to my Sheet</button></div>
</div></div>
<div class="scrim" id="hscrim" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hs-t">
  <h3 id="hs-t">Add a holding</h3><p>Only you see this. It stays on this device and isn't part of the $100 race.</p>
  <label for="hs-sym">Coin or stock</label><select id="hs-sym"></select>
  <div class="two"><div><label for="hs-units" id="hs-ul">How many you own</label><input id="hs-units" type="number" inputmode="decimal" step="any" min="0"></div>
  <div><label for="hs-cost">What you paid in total (optional)</label><div class="pre"><span>$</span><input id="hs-cost" type="number" inputmode="decimal" step="any" min="0"></div></div></div>
  <div class="acts"><button class="btn" id="hs-remove">Remove</button><button class="btn" id="hs-cancel">Cancel</button><button class="btn go" id="hs-save">Save</button></div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const TABS=[["home","Home"],["activity","Activity"],["lanes","Lanes"],["settings","Settings"]];
const Q=new URLSearchParams(location.search);
const BASE=(()=>{if(Q.get("data"))return Q.get("data").replace(/\/?$/,"/");const m=location.hostname.match(/^([^.]+)\.github\.io$/);if(m){const repo=location.pathname.split("/").filter(Boolean)[0];return `https://raw.githubusercontent.com/${m[1]}/${repo}/data/`}return "data/"})();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd=(v,d=2)=>(v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const px=v=>v==null?"":usd(v,v>=100?2:v>=1?2:4);
const signed=v=>(v>=0?"+":"-")+"$"+Math.abs(v).toFixed(2);
const pct=v=>(v>=0?"+":"")+v.toFixed(1)+"%";
const cls=v=>v>=0?"pos":"neg";
const ET=(ts,o)=>new Date(ts*1000).toLocaleString("en-US",Object.assign({timeZone:"America/New_York"},o));
const ago=ts=>{const s=Date.now()/1000-ts;if(s<90)return"just now";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return Math.round(s/3600)+" hr ago";return Math.round(s/86400)+" days ago"};
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const NAMES={BTC:"Bitcoin",ETH:"Ether",SOL:"Solana",XRP:"XRP",DOGE:"Dogecoin",AVAX:"Avalanche",LINK:"Chainlink",ADA:"Cardano",SPY:"S&P 500 fund",QQQ:"Nasdaq 100 fund",IWM:"Small-cap fund",GLD:"Gold fund",TLT:"Treasury bond fund",XLE:"Energy fund",NVDA:"Nvidia",TSLA:"Tesla",AMD:"AMD",PLTR:"Palantir",COIN:"Coinbase",MSTR:"Strategy",META:"Meta",AMZN:"Amazon",SMCI:"Supermicro",HOOD:"Robinhood"};
const TINT={BTC:"#F08C1B",ETH:"#6278E8",SOL:"#9B4DDE",XRP:"#2A3441",DOGE:"#C2A22F",AVAX:"#E3453C",LINK:"#2F5BD9",ADA:"#1D4FA3",MSTR:"#E4661E",NVDA:"#5A9A13",TSLA:"#C9302C",SPY:"#3E5A7E",QQQ:"#2C6E8F",GLD:"#B08A1E",XLE:"#4F7A3A",COIN:"#1652F0",PLTR:"#303640",AMD:"#1B1B1B",META:"#1877F2",AMZN:"#E5901B",SMCI:"#1F6F3F",HOOD:"#2FA85A",IWM:"#6B5BA6",TLT:"#51667D"};
const av=s=>`<div class="av" style="background:${TINT[s]||"#5B35E8"}">${esc(s.length>4?s.slice(0,4):s)}</div>`;
const COINS=["BTC","ETH","SOL","XRP","DOGE","AVAX","LINK","ADA"];
const krakenWeb=s=>COINS.includes(s)?`https://pro.kraken.com/app/trade/${s.toLowerCase()}-usd`:`https://www.kraken.com/stocks/${s.toLowerCase()}`;
const isAndroid=()=>/android/i.test(navigator.userAgent);
// On Android this Kraken link is claimed by the Kraken app, so it opens the app (tested on Clint's phone, Sep 21).
const KRAKEN_APP="https://www.kraken.com/pay";
const krakenLink=s=>isAndroid()?KRAKEN_APP:krakenWeb(s);
const krChip=(s,label)=>`<a class="krc" href="${esc(krakenLink(s))}" ${isAndroid()?"":'target="_blank" rel="noopener"'} data-krchip="${esc(s)}">${esc(label||"Kraken")}${KR_ICON.replace('width="18" height="18"','width="13" height="13"')}</a>`;
const KR_ICON=`<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>`;
let D={},drawn=false;

/* ---------- data ---------- */
async function load(){
  const files=["race","alerts","feed","markets","watch","health","config"];
  try{
    const res=await Promise.all(files.map(f=>fetch(BASE+f+".json?t="+Math.floor(Date.now()/60000)).then(r=>{if(!r.ok)throw new Error(f);return r.json()})));
    files.forEach((f,i)=>D[f]=res[i]);$("error").innerHTML="";render();openFromHash();
  }catch(e){$("error").innerHTML=`<div class="err">Can't reach the race data right now (${esc(e.message)}). It usually means the first check hasn't run yet. Try again in a few minutes.</div>`}
}
const cfg=()=>D.config||{};
const myLanes=()=>(cfg().alert_lanes||["F"]).concat(cfg().past_alert_lanes||[]);
const YOU=()=>(cfg().alert_lanes||["F"])[0];

const KPAIR={BTC:"XXBTZUSD",ETH:"XETHZUSD",SOL:"SOLUSD",XRP:"XXRPZUSD",DOGE:"XDGUSD",AVAX:"AVAXUSD",LINK:"LINKUSD",ADA:"ADAUSD"};
let LIVE={};
async function livePrices(){
  try{const r=await fetch("https://api.kraken.com/0/public/Ticker?pair="+Object.values(KPAIR).join(",")).then(r=>r.json());
    for(const [s,k] of Object.entries(KPAIR)){const t=r.result&&r.result[k];if(t)LIVE[s]={price:+t.c[0],open:+t.o,at:Date.now()}}
    if(D.race)render();
  }catch(e){}
}
function priceNow(sym){if(LIVE[sym])return LIVE[sym].price;const r=((D.markets||{}).rows||[]).find(x=>x.symbol===sym);return r?r.price:null}
function dayChange(sym){if(LIVE[sym]&&LIVE[sym].open)return (LIVE[sym].price/LIVE[sym].open-1)*100;const r=((D.markets||{}).rows||[]).find(x=>x.symbol===sym);return r&&r.change!=null?r.change:null}
function others(){try{return JSON.parse(store.get("race_other")||"[]")}catch(e){return[]}}
function sigPrice(a){if(a.price!=null)return a.price;const m=(a.detail||"").match(/Filled at \$([\d,.]+)/);return m?parseFloat(m[1].replace(/,/g,"")):null}
function signals(){return (D.alerts||[]).filter(a=>(a.kind==="buy"||a.kind==="sell")&&myLanes().includes(a.lane))}
function statusOf(a){const l=logged()[a.id];if(l)return l.choice==="Done"?"done":"skipped";return a.status==="info"?"done":a.status}
function portfolio(){
  const start=cfg().start_cash||100,L=logged();let cash=start;const hold={};
  signals().filter(a=>statusOf(a)==="done").sort((a,b)=>a.ts-b.ts).forEach(a=>{
    const l=L[a.id]||{},price=l.price||sigPrice(a),dol=l.dollars!=null?l.dollars:(a.dollars!=null?a.dollars:null);
    if(a.kind==="buy"&&price&&dol){cash-=dol;const h=hold[a.symbol]||{units:0,cost:0,ts:a.ts,own:!!l.price};h.units+=dol/price;h.cost+=dol;hold[a.symbol]=h}
    if(a.kind==="sell"&&hold[a.symbol]){cash+=hold[a.symbol].units*(price||priceNow(a.symbol)||0);delete hold[a.symbol]}
  });
  const rows=Object.entries(hold).map(([s,h])=>{const now=priceNow(s)||h.cost/h.units,value=h.units*now;return{symbol:s,...h,avg:h.cost/h.units,now,value,pnl:value-h.cost}});
  const invested=rows.reduce((t,r)=>t+r.value,0);
  return{start,cash,rows,invested,total:cash+invested,pnl:cash+invested-start};
}

function chart(){
  const R=D.race,F=R.lanes.find(l=>l.id===YOU())||R.lanes.find(l=>l.id==="F"),S=R.bench.find(b=>b.id==="SPY");
  const series=[[F,"var(--violet)",false],[S,"#9AA1AE",true]].filter(s=>s[0]&&s[0].history.length);
  const W=Math.max(320,Math.round(($("chart").clientWidth||720))),H=W<500?190:210,PL=46,PB=26,pts=series.flatMap(s=>s[0].history);
  if(!series.length||series[0][0].history.length<3){$("chart").innerHTML=`<p class="sub" style="padding:34px 8px 20px">Your line starts drawing after a few checks. Give it a day.</p>`;return}
  const t0=Math.min(...pts.map(p=>p[0])),t1=Math.max(...pts.map(p=>p[0]));
  let lo=Math.min(99.5,...pts.map(p=>p[1])),hi=Math.max(100.5,...pts.map(p=>p[1]));const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const X=t=>PL+(t-t0)/((t1-t0)||1)*(W-PL-8),Y=v=>(H-PB)-(v-lo)/(hi-lo)*(H-PB-8);
  const step=[0.5,1,2,5,10,20].find(s=>(hi-lo)/s<=5)||20;
  let g="";for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line x1="${PL}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${Math.abs(v-100)<1e-6?"#C9CDD6":"#EEF0F4"}" ${Math.abs(v-100)<1e-6?'stroke-dasharray="3 4"':""}/><text class="ax" x="${PL-8}" y="${Y(v)+4}" text-anchor="end">$${+v.toFixed(1)}</text>`;
  const days=Math.max(1,Math.round((t1-t0)/86400));const every=Math.max(1,Math.ceil(days/5));
  for(let d=0;d<=days;d+=every){const t=t0+d*86400;if(t>t1+1)break;g+=`<text class="ax" x="${X(t)}" y="${H-6}" text-anchor="${d===0?"start":"middle"}">${ET(t,{month:"short",day:"numeric"})}</text>`}
  const path=h=>h.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const f=series[0][0].history,area=path(f)+` L${X(f[f.length-1][0]).toFixed(1)} ${H-PB} L${X(f[0][0]).toFixed(1)} ${H-PB} Z`;
  $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Value over time"><defs><linearGradient id="fa" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5B35E8" stop-opacity=".16"/><stop offset="1" stop-color="#5B35E8" stop-opacity="0"/></linearGradient></defs>${g}
    <path d="${area}" fill="url(#fa)"/>${series.map(([l,c,dash],i)=>`<path class="${i?"":"draw"}" d="${path(l.history)}" fill="none" stroke="${c}" stroke-width="${dash?2:3}" stroke-linejoin="round" stroke-linecap="round" ${dash?'stroke-dasharray="5 5"':""}/>`).join("")}
    <line id="hx" y1="0" y2="${H-PB}" stroke="#16181D" stroke-opacity=".2" visibility="hidden"/><circle id="hd" r="5" fill="#5B35E8" stroke="#fff" stroke-width="2" visibility="hidden"/></svg><div class="tip" id="tip"></div>`;
  const p=document.querySelector("#chart .draw");
  if(p&&!drawn&&!matchMedia("(prefers-reduced-motion: reduce)").matches){const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition="stroke-dashoffset 1.1s ease-out";p.style.strokeDashoffset=0;drawn=true}
  const svg=document.querySelector("#chart svg");
  svg.onpointermove=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;let best=f[0];for(const q of f)if(Math.abs(X(q[0])-x)<Math.abs(X(best[0])-x))best=q;
    $("hx").setAttribute("x1",X(best[0]));$("hx").setAttribute("x2",X(best[0]));$("hx").setAttribute("visibility","visible");$("hd").setAttribute("cx",X(best[0]));$("hd").setAttribute("cy",Y(best[1]));$("hd").setAttribute("visibility","visible");
    const tip=$("tip");tip.style.left=(X(best[0])/W*100)+"%";tip.style.top=(Y(best[1])/H*r.height)+"px";tip.textContent=`${usd(best[1])} · ${ET(best[0],{weekday:"short",hour:"numeric",minute:"2-digit"})}`;tip.style.opacity=1};
  svg.onpointerleave=()=>{$("hx").setAttribute("visibility","hidden");$("hd").setAttribute("visibility","hidden");$("tip").style.opacity=0};
}

  $("savelinks").onclick=()=>{store.set("race_sheet",$("in-sheet").value.trim());store.set("race_form",$("in-form").value.trim());toast("Saved on this device");render()};
  const bad=Object.entries(H).filter(([,v])=>!v.ok).length;
  $("sys").innerHTML=`<h2>Behind the scenes</h2><p class="sub">${bad?bad+" of "+Object.keys(H).length+" data sources need a look. The rest are fine.":"Every data source is working."} AI spend this month: ${usd(ai.cost||0)} of ${usd(D.race.ai_cap||4.5)}.</p><div class="health">${Object.entries(H).map(([k,v])=>`<div class="hl ${v.ok?"":"bad"}"><i></i>${esc(k)}<small>${v.ok?ago(v.at):"trouble"}</small></div>`).join("")}</div>`;
  $("rules").innerHTML=installCard()+`<h2 style="margin-top:26px">How it runs</h2><dl class="facts"><dt>Your lane</dt><dd>Lane ${esc(YOU())}, on Kraken</dd><dt>Alerts</dt><dd>Only when lane ${esc(YOU())} wants you to buy or sell</dd><dt>Checks</dt><dd>Every 5 minutes. Lane ${esc(YOU())} decides once each trading day at 10:00 AM Eastern</dd><dt>Quiet hours</dt><dd>${c.quiet_hours_et[0]>12?c.quiet_hours_et[0]-12:c.quiet_hours_et[0]} PM to ${c.quiet_hours_et[1]} AM Eastern. Buys wait, sells always come through</dd><dt>Race length</dt><dd>${c.race_days} days</dd><dt>Crypto fee used</dt><dd>${(c.fees.kraken_limit*100).toFixed(2)}% (Kraken limit order)</dd><dt>Stocks</dt><dd>Commission-free on Kraken</dd><dt>Phone channel</dt><dd>ntfy app</dd></dl>`;
}

/* ---------- install as an app ---------- */
let deferredPrompt=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(D.race)settings()});
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function installCard(){
  if(standalone())return `<h2>Installed</h2><p class="sub">You're using the app version. Nice.</p>`;
  const how=isIOS()?`<ol class="steps"><li>Open this page in Safari.</li><li>Tap the Share button at the bottom.</li><li>Tap Add to Home Screen, then Add.</li></ol>`
    :`<ol class="steps"><li>In Chrome or Edge, open the browser menu.</li><li>Tap Install app (or Add to Home screen).</li></ol>`;
  return `<h2>Get the app</h2><p class="sub">Put the race on your home screen. It opens full screen like any other app, no app store needed.</p>${deferredPrompt?`<div class="acts"><button class="btn go" id="installbtn">Install the app</button></div>`:how}`;
}
document.addEventListener("click",async e=>{if(e.target.id==="installbtn"&&deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;settings()}});
addEventListener("appinstalled",()=>{toast("Installed. Look for $100 Race on your home screen.");settings()});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ---------- logging a trade ---------- */
let cur=null;
function openSheet(id){
  const a=signals().find(x=>x.id===id);if(!a)return;
  cur=a;const buy=a.kind==="buy";
  $("sh-t").textContent=`${buy?"Buy":"Sell"} ${NAMES[a.symbol]||a.symbol}`;
  $("sh-p").textContent=`${isAndroid()?`Open Kraken, tap Home, then ${a.symbol}.`:"Place it on Kraken,"} Then enter what you actually ${buy?"paid":"got"}. The signal price was ${px(sigPrice(a))}.`;
  $("sh-pl").textContent=buy?"Price you paid":"Price you sold at";
  $("sh-price").value=sigPrice(a)??"";
  const held=portfolio().rows.find(r=>r.symbol===a.symbol);
  $("sh-dol").value=buy?(a.dollars!=null?a.dollars.toFixed(2):""):(held&&sigPrice(a)?(held.units*sigPrice(a)).toFixed(2):"");
  $("sh-dl").textContent=buy?"Dollars you put in":"Dollars you got back";
  const k=$("sh-kr");k.href=krakenLink(a.symbol);if(isAndroid()){k.removeAttribute("target")}else{k.target="_blank";k.rel="noopener"}
  k.innerHTML=`${KR_ICON}${buy?"Buy":"Sell"} ${esc(a.symbol)} on Kraken first`;
  $("scrim").classList.add("on");$("scrim").setAttribute("aria-hidden","false");setTimeout(()=>$("sh-price").select(),60);
}
function closeSheet(){$("scrim").classList.remove("on");$("scrim").setAttribute("aria-hidden","true");cur=null;if(location.hash.startsWith("#log-"))history.replaceState(null,"",location.pathname+location.search+"#home")}
function formPost(a,choice,price,dollars){
  const f=formLink(),e=cfg().form_entries;
  if(!f||!e||!f.includes("/viewform"))return Promise.reject(new Error("no form"));
  const fields={[e.id]:a.id,[e.choice]:choice,[e.platform]:cfg().platform||"Kraken",[e.asset]:a.symbol||"",[e.dollars]:dollars??"",[e.price]:price??"",
    [e.notes]:choice==="Done"?`${a.kind==="buy"?"Bought":"Sold"} from the dashboard`:"Skipped from the dashboard"};
  const url=f.split("/viewform")[0]+"/formResponse?"+new URLSearchParams(Object.entries(fields).map(([k,v])=>["entry."+k,String(v)])).toString();
  return fetch(url,{method:"POST",mode:"no-cors"});
}
function remember(id,rec){const m=logged();m[id]=rec;store.set("race_logged",JSON.stringify(m))}
$("sh-save").onclick=async()=>{
  const a=cur;if(!a)return;const price=parseFloat($("sh-price").value),dol=parseFloat($("sh-dol").value);
  if(!(price>0)){$("sh-price").focus();return}
  $("sh-save").disabled=true;$("sh-save").textContent="Saving";
  try{await formPost(a,"Done",price,isFinite(dol)?dol:"");remember(a.id,{choice:"Done",price,dollars:isFinite(dol)?dol:null,ts:Date.now()/1000});closeSheet();render();toast(`${a.kind==="buy"?"Bought":"Sold"} ${a.symbol} is in your Sheet`)}
  catch(e){toast("Couldn't reach your Sheet. Check your connection and try again.")}
  finally{$("sh-save").disabled=false;$("sh-save").textContent="Save to my Sheet"}
};
$("sh-cancel").onclick=closeSheet;
$("scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&editing!==undefined&&$("hscrim").classList.contains("on"))closeHold();if(e.key==="Escape"&&cur)closeSheet();if(e.key==="Enter"&&cur)$("sh-save").click()});
document.addEventListener("click",async e=>{
  const l=e.target.closest("[data-log]");if(l){openSheet(l.dataset.log);return}
  const s=e.target.closest("[data-skip]");if(s){const a=signals().find(x=>x.id===s.dataset.skip);if(!a)return;s.disabled=true;
    try{await formPost(a,"Skipped","","");remember(a.id,{choice:"Skipped",ts:Date.now()/1000});render();toast(`Skipped ${a.symbol}`)}catch(err){s.disabled=false;toast("Couldn't reach your Sheet. Try again.")}}
});
function openFromHash(){const m=location.hash.match(/^#log-(\w+)/);if(m&&!cur){const a=signals().find(x=>x.id===m[1]);if(a&&statusOf(a)==="open")openSheet(a.id)}}
let tt;function toast(t){$("toast").textContent=t;$("toast").classList.add("on");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.remove("on"),2600)}

/* ---------- tabs ---------- */
function tabs(){
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" id="t-${k}" aria-selected="false">${l}</button>`).join("");
  $("tabs").onclick=e=>{const b=e.target.closest("button");if(b)show(b.id.slice(2))};
  window.addEventListener("hashchange",()=>{show((location.hash.slice(1)||"home").replace(/^log-.*/,"home"),true);openFromHash()});
  show((location.hash.slice(1)||"home").replace(/^log-.*/,"home"),true);
}
function show(k,fromHash){if(!TABS.some(t=>t[0]===k))k="home";TABS.forEach(([t])=>{$("t-"+t).setAttribute("aria-selected",t===k);$("p-"+t).classList.toggle("on",t===k)});if(!fromHash)history.replaceState(null,"","#"+k);window.scrollTo({top:0})}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(D.race)chart()},150)});
tabs();load();livePrices();setInterval(load,60000);setInterval(livePrices,60000);
</script>
</body>
</html>
